<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Promise Demo</h1>
    <script>
        // creating a promise that may succeed or fail randomly
        let promise = new Promise((resolve, reject)=>{
            let random = Math.random();
            if(random > 0.5) {
                resolve(`Success: ${random}`);
            } else {
                reject(`Failure: ${random}`);
            }
        });
        // to handle the promise result
        promise
        .then((response)=>console.log(response))
        .catch((error)=>console.log(error));
        console.log("Hello World at the end of the promise");
         // async / await
        async function test() {
            // await will wait for the promise to settle - resolved | rejected
            let result = await promise;
            return result;
        }
        let r = test().then(r => console.log("r = "+r)).catch(e => console.log("e = "+e));
        // console.log("value of r = "+r);
        // in react : axios.get(URL).then().catch()
        // in angular: http.get(URL).then().catch()
        // in javascript: fetch().get(URL).then().catch()
    </script>
</body>
</html>
